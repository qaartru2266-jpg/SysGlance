name: Release Windows x64

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    # Keep the Visual Studio 2022 generator below stable. windows-latest can
    # advance to a newer image where this generator is no longer available.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          $name = "SysGlance-${{ github.ref_name }}-win-x64"
          New-Item -ItemType Directory -Path release\$name | Out-Null
          Copy-Item build\Release\SysGlance.exe release\$name\SysGlance.exe
          Copy-Item packaging\README.txt release\$name\README.txt
          Compress-Archive -Path release\$name -DestinationPath release\$name.zip -CompressionLevel Optimal
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release\*.zip --generate-notes
